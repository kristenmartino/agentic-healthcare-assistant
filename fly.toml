# Fly.io config for the FastAPI service. Lives at the REPO ROOT so the
# Docker build context is the project root (Dockerfile COPYs requirements.txt
# from the project root), and the dockerfile path resolves cleanly.
#
# First deploy:
#     flyctl auth login
#     flyctl launch --no-deploy --copy-config --name agentic-healthcare-api
#     flyctl secrets set ANTHROPIC_API_KEY=sk-ant-... TAVILY_API_KEY=tvly-... \
#         EHR_BACKEND=fhir_fixture ENABLE_PERSISTENCE=false \
#         CORS_ALLOW_ORIGINS=https://agentic-healthcare.kristenmartino.ai
#     flyctl deploy
#
# All commands run from the repo root.

app = "agentic-healthcare-api"
primary_region = "iad"   # us-east — closest to Vercel's edge for most traffic

[build]
  dockerfile = "api/Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # "suspend" snapshots the machine's memory and resumes in ~sub-second on the
  # next request, instead of a full cold boot (container start → uvicorn →
  # LangGraph workflow build → slot top-up) that "stop" pays. Billed for rootfs
  # storage while idle rather than running CPU/RAM, so it's far cheaper than
  # keeping a machine warm — best latency-per-dollar for the first request
  # after idle. min_machines_running stays 0; auto_start brings it back.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

# Single small machine is plenty for portfolio traffic.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
