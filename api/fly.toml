# Fly.io config for the FastAPI service.
#
# First deploy:
#     flyctl auth login
#     flyctl launch --no-deploy --config api/fly.toml --dockerfile api/Dockerfile
#     flyctl secrets set ANTHROPIC_API_KEY=sk-ant-... TAVILY_API_KEY=tvly-...
#     flyctl secrets set EHR_BACKEND=fhir_fixture ENABLE_PERSISTENCE=false
#     flyctl secrets set CORS_ALLOW_ORIGINS=https://agentic-healthcare.kristenmartino.ai
#     flyctl deploy --config api/fly.toml --dockerfile api/Dockerfile
#
# Pick your own app name (must be unique on Fly); change the `app =` line.
# Suggestion: agentic-healthcare-api (matches the kristenmartino.ai subdomain).

app = "agentic-healthcare-api"
primary_region = "iad"   # us-east — closest to Vercel's edge for most traffic

[build]
  dockerfile = "api/Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"      # spin down between requests on free tier
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

# Single small machine is plenty for portfolio traffic.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
