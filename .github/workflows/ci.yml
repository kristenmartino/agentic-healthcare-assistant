name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Install runtime + test deps
        # Skip sentence-transformers (large; pulls torch). The graph already
        # falls back to TF-IDF / numpy dot-product when not present, and our
        # unit tests don't exercise the vector index. Skip langchain-groq /
        # langchain-openai — no API key in CI; the stub provider handles it.
        run: |
          pip install -r requirements.txt \
            || pip install \
              langgraph langchain langchain-community \
              langgraph-checkpoint-sqlite \
              openpyxl pypdf pdfminer.six \
              streamlit duckduckgo-search requests \
              python-dotenv pydantic typing-extensions \
              pytest responses

      - name: Run pytest
        env:
          EHR_BACKEND: fhir_fixture
        run: pytest -v

      - name: Deterministic eval (routing + state shape)
        env:
          EHR_BACKEND: fhir_fixture
        # The eval prints a JSON summary; we require ≥60% pass rate.
        # Stub LLM gives us 100% on the original 10 cases historically,
        # so anything below ~80% means a regression — fail loud.
        run: |
          python -m eval.qa_eval || (echo "::error::eval suite regressed" && exit 1)

      - name: Adversarial eval (safety + PHI isolation + prompt injection)
        env:
          EHR_BACKEND: fhir_fixture
        # Exits non-zero only on red-line dimension failures (safety < 3
        # or phi_isolation < 3). The "pass rate" can dip in stub mode
        # because the stub LLM can't refuse jailbreaks; the red-line
        # criterion catches real regressions without flaking on stub.
        run: |
          python -m eval.adversarial || (echo "::error::adversarial eval red-line failure" && exit 1)

  web-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Run tests
        working-directory: web
        run: npm test

      - name: Lint
        working-directory: web
        run: npm run lint

  # Auto-deploy the FastAPI service to Fly.io after tests pass on main.
  # This closes the "merged but not live" gap that left the PHI-scope fix
  # un-deployed: when deploys are manual, a security fix can sit on main
  # while production still runs the vulnerable code. Skips cleanly (with a
  # warning, not a failure) until the FLY_API_TOKEN repo secret is added,
  # so it never reds-out main before the deploy credential is configured.
  deploy:
    needs: [lint-and-test, web-test]
    runs-on: ubuntu-latest
    # Deploy on merge to main, or on a manual "Run workflow" against main
    # (Actions tab → workflow_dispatch) — the latter is the on-demand
    # redeploy path when no code changed (e.g. just added FLY_API_TOKEN).
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-fly
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check for deploy credential
        id: check
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN secret is not set — skipping deploy. Add it (repo Settings → Secrets and variables → Actions) to enable auto-deploy to Fly.io."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Set up flyctl
        if: steps.check.outputs.present == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: steps.check.outputs.present == 'true'
        # Uses fly.toml at the repo root (build = api/Dockerfile). Remote
        # builder so the runner doesn't need a local Docker daemon.
        run: flyctl deploy --remote-only
